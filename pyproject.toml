[project]
name = "evidence-desk"
version = "1.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
    "sqlalchemy==2.0.40",
    "psycopg[binary]==3.2.6",
    "pgvector==0.4.1",
    "pydantic-settings==2.9.1",
    "python-multipart==0.0.33",
    "pypdf==6.11.0",
    "openai==3.45.0",
    "google-genai==2.34.0",
    "opentelemetry-api==1.44.0",
    "opentelemetry-sdk==1.44.0",
    "opentelemetry-instrumentation-fastapi==0.65b0",
    "starlette==1.10.0",
]
[dependency-groups]
dev = ["pytest==8.3.5", "pytest-asyncio==0.26.0", "httpx==0.28.1", "ruff==0.11.6", "mypy==1.15.0"]
[tool.pytest.ini_options]
pythonpath = ["services/api"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["live: paid external API smoke tests; explicitly opt in"]
[tool.ruff]
line-length = 110
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
follow_imports = "silent"

[[tool.mypy.overrides]]
module = ["openai.*", "google.*"]
follow_imports = "skip"
